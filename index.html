<!DOCTYPE html>
<html>
<head>
  <title>Mindmelo AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg,#e3f2fd,#f3e5f5,#fce4ec);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar button {
      position: relative;
      border: none;
      background: #f8bbd0;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      font-size: 18px;
    }

    .sidebar button::after {
      content: attr(data-label);
      position: absolute;
      left: 60px;
      top: 50%;
      transform: translateY(-50%);
      background: #333;
      color: white;
      padding: 5px 10px;
      border-radius: 6px;
      opacity: 0;
      transition: 0.2s;
      font-size: 12px;
      white-space: nowrap;
    }
    input::placeholder {
  color: #6a1b9a;
  font-weight: 500;
}

    .sidebar button:hover::after {
      opacity: 1;
    }

    /* Main */
    .container {
      width: 360px;
      height: 600px;
      background: #ffffffcc;
      border-radius: 25px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(15px);
    }

    .header {
      text-align: center;
      padding: 12px;
      font-weight: bold;
      background: linear-gradient(90deg,#b3e5fc,#e1bee7,#f8bbd0);
      border-radius: 25px 25px 0 0;
      position: relative;
    }

    .profile-icon {
      position: absolute;
      right: 10px;
      top: 10px;
      cursor: pointer;
    }

    #chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .msg {
      margin: 6px;
      padding: 10px;
      border-radius: 12px;
      max-width: 75%;
      font-size: 13px;
    }

    .user { background:#d1c4e9; align-self:flex-end; }
    .bot { background:#e1f5fe; align-self:flex-start; }

    input {
      flex:1;
      padding:10px;
      border:none;
      outline:none;
      background:#f3e5f5;
    }

    button.send {
      border:none;
      padding:10px;
      background:#b3e5fc;
      cursor:pointer;
    }

    /* Popups */
    .popup {
      position: absolute;
      top: 60px;
      right: 20px;
      width: 280px;
      background: white;
      border-radius: 15px;
      display: none;
      padding: 10px;
    }

    /* Dashboard */
    #dashboard {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    /* 🌸 JOURNAL BEAUTIFUL UI */
.journal-box {
  width: 350px;
  height: 500px;
  right: 20px;
  top: 50px;
  padding: 15px;
  overflow-y: auto;
  background: #ffffffee;
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  border-radius: 20px;
  animation: fadeIn 0.3s ease;
}

.journal-box h2 {
  text-align: center;
  margin-bottom: 10px;
  font-family: "Segoe UI", sans-serif;
}

#journalText {
  width: 100%;
  height: 120px;
  border-radius: 12px;
  border: none;
  padding: 10px;
  background: #f3e5f5;
  outline: none;
  font-size: 14px;
  resize: none;
  margin-bottom: 10px;
}

.save-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#b3e5fc,#e1bee7);
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 10px;
}

#journalList {
  max-height: 260px;
  overflow-y: auto;
}

/* Entries */
.journal-entry {
  background: #fce4ec;
  padding: 10px;
  border-radius: 12px;
  margin-bottom: 8px;
  animation: fadeIn 0.3s ease;
}

.journal-date {
  font-size: 11px;
  color: #555;
  margin-bottom: 5px;
}

.lock-box {
  width: 300px;
  padding: 20px;
  text-align: center;
  background: #ffffffee;
  backdrop-filter: blur(15px);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.lock-box input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  background: #f3e5f5;
  outline: none;
}

.lock-box button {
  padding: 10px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#b3e5fc,#e1bee7);
  cursor: pointer;
  font-weight: bold;
}

.affirmation-box {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ffffffcc;
  backdrop-filter: blur(10px);
  padding: 12px 18px;
  border-radius: 15px;
  font-size: 13px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  opacity: 0;
  transition: 0.4s;
}

    canvas {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<script>
if(!localStorage.getItem("username")){
  window.location.href="login.html";
}
</script>

<!-- Sidebar -->
<div class="sidebar">
  <button data-label="Dashboard" onclick="toggleDashboard()">📊</button>
  <button data-label="History" onclick="togglePopup('historyPopup')">📜</button>
  <button data-label="Analysis" onclick="togglePopup('analysisPopup')">🧠</button>
  <button data-label="Profile" onclick="toggleProfile()">👤</button>
  <button data-label="Journal" onclick="openJournalLock()">📝</button>
  <button data-label="Logout" onclick="logout()">🚪</button>
  
</div>

<!-- Main -->
<div class="container">
  <div class="header">
    Mindmelo 💙
  </div>

  <div id="mood" style="text-align:center;">Mood: 🙂</div>

  <div id="chatbox"></div>

  <div style="display:flex;">
    <input id="userInput" placeholder="Type your feelings..." />
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Popups -->
<div id="historyPopup" class="popup">
  <h3>📜 History</h3>
  <div id="history"></div>
</div>

<div id="analysisPopup" class="popup">
  <h3>🧠 Analysis</h3>
  <div id="analysis"></div>
</div>

<div id="profilePopup" class="popup">
  <h3>👤 Profile</h3>
  <p>Name: <span id="pname"></span></p>
  <p>Age: <span id="page"></span></p>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <h2>Mood Insights 📊</h2>
  <canvas id="barChart"></canvas>
  <canvas id="lineChart"></canvas>
</div>

<div id="journalPopup" class="popup journal-box">
  <h2>📝 Your Safe Space</h2>

  <textarea id="journalText" placeholder="Write your thoughts..."></textarea>

  <button class="save-btn" onclick="saveJournal()">Save Entry</button>

  <div id="journalList"></div>
</div>

<div id="lockPopup" class="popup lock-box">
  <h2>🔒 Secure Journal</h2>

  <p id="lockText">Enter your PIN</p>

  <input type="password" id="journalPin" placeholder="Enter PIN" />

  <button onclick="handlePin()">Continue</button>
</div>

<div id="affirmationBox" class="affirmation-box"></div>

<script>

let moodHistory=[];
let moodScores=[];
let chart1, chart2;
let currentPopup=null;
let profileOpen=false;

// Enter key
document.getElementById("userInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") sendMessage();
});

// SEND MESSAGE
async function sendMessage(){
  let input=document.getElementById("userInput").value.trim();
  if(!input) return;

  let chatbox=document.getElementById("chatbox");
  const username=localStorage.getItem("username")||"Friend";

  chatbox.innerHTML+=`<div class="msg user">${input}</div>`;
  document.getElementById("userInput").value="";

  chatbox.innerHTML+=`<div class="msg bot" id="typing">Typing...</div>`;

  let res=await fetch("http://localhost:5000/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body:JSON.stringify({message:input,name:username})
  });

  let data=await res.json();
  document.getElementById("typing")?.remove();

  chatbox.innerHTML+=`<div class="msg bot">${data.reply}</div>`;
  chatbox.scrollTop=chatbox.scrollHeight;

  updateMood(data.mood);
  showAffirmation(data.affirmation);
  localStorage.setItem("moodHistory", JSON.stringify(data.moodHistory));
}

// MOOD
function updateMood(mood){
  let emoji="🙂", score=3;

  if(mood==="happy"){ emoji="😊"; score=5; }
  else if(mood==="sad"){ emoji="💙"; score=2; }
  else if(mood==="stressed"){ emoji="😓"; score=1; }

  document.getElementById("mood").innerText="Mood: "+emoji;

  moodHistory.push(emoji);
  moodScores.push(score);

  document.getElementById("history").innerText=moodHistory.join(" → ");

  analyze();
}

// ANALYSIS
function analyze(){
  let avg=moodScores.reduce((a,b)=>a+b,0)/moodScores.length;

  let msg="";
  if(avg>=4) msg="😊 Positive mood overall!";
  else if(avg>=2) msg="🙂 Mixed emotions.";
  else msg="💙 You may be stressed.";

  document.getElementById("analysis").innerText=msg;
}

// DASHBOARD
function toggleDashboard(){
  let d=document.getElementById("dashboard");

  if(d.style.display==="block"){
    d.style.display="none";
  } else {
    d.style.display="block";
    renderCharts();
  }
}

function renderCharts(){
  let history=JSON.parse(localStorage.getItem("moodHistory"))||[];

  let counts={happy:0,sad:0,stressed:0,neutral:0};
  history.forEach(m=>counts[m]++);

  if(chart1) chart1.destroy();
  if(chart2) chart2.destroy();

  chart1=new Chart(document.getElementById("barChart"),{
    type:"bar",
    data:{
      labels:["Happy","Sad","Stressed","Neutral"],
      datasets:[{data:Object.values(counts)}]
    }
  });

  chart2=new Chart(document.getElementById("lineChart"),{
    type:"line",
    data:{
      labels:moodScores.map((_,i)=>i+1),
      datasets:[{data:moodScores}]
    }
  });
}

// POPUPS
function togglePopup(id){
  let p=document.getElementById(id);

  if(currentPopup===id){
    p.style.display="none";
    currentPopup=null;
    return;
  }

  document.querySelectorAll(".popup").forEach(x=>x.style.display="none");
  p.style.display="block";
  currentPopup=id;

   if(id==="journalPopup"){
    loadJournal();
  }
}

// PROFILE
function toggleProfile(){
  let p=document.getElementById("profilePopup");

  if(profileOpen){
    p.style.display="none";
    profileOpen=false;
  } else {
    p.style.display="block";
    profileOpen=true;

    document.getElementById("pname").innerText=localStorage.getItem("username");
    document.getElementById("page").innerText=localStorage.getItem("age");
  }
}

// LOGOUT
function logout(){
  window.location.href="login.html";
}

//jounal lock
function openJournalLock(){
  // 👉 If already open → CLOSE EVERYTHING
  if(currentPopup === "lockPopup" || currentPopup === "journalPopup"){
    document.querySelectorAll(".popup").forEach(p => p.style.display = "none");
    currentPopup = null;
    return;
  }

  let savedPin = localStorage.getItem("journalPin");

  document.querySelectorAll(".popup").forEach(p => p.style.display = "none");

  document.getElementById("lockPopup").style.display = "block";
  currentPopup = "lockPopup";

  if(!savedPin){
    document.getElementById("lockText").innerText = "Set a PIN for your journal";
  } else {
    document.getElementById("lockText").innerText = "Enter your PIN";
  }
}

function handlePin(){
  let inputPin = document.getElementById("journalPin").value;
  let savedPin = localStorage.getItem("journalPin");

  if(!inputPin) return;

  // First time → set PIN
  if(!savedPin){
    localStorage.setItem("journalPin", inputPin);
    alert("PIN set successfully 🔒");

    openJournal();
    return;
  }

  // Check PIN
  if(inputPin === savedPin){
    openJournal();
  } else {
    alert("Wrong PIN ❌");
  }
}

//jounal functions
function openJournal(){
  document.getElementById("lockPopup").style.display = "none";

  document.getElementById("journalPopup").style.display = "block";
  currentPopup = "journalPopup";

  document.getElementById("journalPin").value = "";

  loadJournal();
}

async function saveJournal() {
  let text = document.getElementById("journalText").value;
  let username = localStorage.getItem("username") || "Friend";

  if (!text) return;

  await fetch("http://localhost:5000/journal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: username,
      text: text
    })
  });

  document.getElementById("journalText").value = "";

  loadJournal();
  showAffirmation();
}

async function loadJournal() {
  let username = localStorage.getItem("username") || "Friend";

  let res = await fetch(`http://localhost:5000/journal/${username}`);
  let data = await res.json();

  let html = "";

  data.reverse().forEach(entry => {
    let date = new Date(entry.date).toLocaleString();

    html += `
      <div class="journal-entry">
        <div class="journal-date">${date}</div>
        <div>${entry.text}</div>
      </div>
    `;
  });

  document.getElementById("journalList").innerHTML = html;
}

function showAffirmation(text){
  let box = document.getElementById("affirmationBox");

  box.innerText = text || "You're doing okay 💙";

  box.style.opacity = 1;

  setTimeout(()=>{
    box.style.opacity = 0;
  }, 3000);
}

</script>

</body>
</html>
