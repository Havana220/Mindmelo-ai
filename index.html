<!DOCTYPE html>
<html>
<head>
  <title>Mindmelo AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  margin: 0;

  font-family: "Segoe UI", Arial, sans-serif;

  background:
    radial-gradient(circle at 10% 20%, rgba(179,229,252,0.65), transparent 28%),
    radial-gradient(circle at 90% 20%, rgba(225,190,231,0.55), transparent 30%),
    radial-gradient(circle at 80% 90%, rgba(248,187,208,0.5), transparent 30%),
    linear-gradient(135deg, #f5f9ff, #fbf5fc, #fff7fa);

  color: #403851;

  overflow: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
  position: fixed;

  left: 22px;
  top: 50%;
  transform: translateY(-50%);

  width: 72px;
  padding: 14px 10px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;

  background: rgba(255,255,255,0.55);
  backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 28px;

  box-shadow:
    0 15px 45px rgba(90,70,120,0.13);

  z-index: 20;
}


/* Sidebar buttons */

.sidebar button {
  position: relative;

  width: 48px;
  height: 48px;

  border: 1px solid rgba(255,255,255,0.7);

  border-radius: 16px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,0.85),
      rgba(245,225,242,0.75)
    );

  cursor: pointer;

  font-size: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    background 0.25s ease;
}


.sidebar button:hover {
  transform: translateY(-3px) scale(1.06);

  background:
    linear-gradient(
      145deg,
      #dff4ff,
      #f0ddf5
    );

  box-shadow:
    0 8px 20px rgba(120,90,160,0.18);
}


/* Tooltip */

.sidebar button::after {
  content: attr(data-label);

  position: absolute;

  left: 62px;
  top: 50%;

  transform: translateY(-50%) translateX(-5px);

  padding: 8px 12px;

  background: rgba(55,48,75,0.92);

  color: white;

  border-radius: 10px;

  font-size: 12px;

  white-space: nowrap;

  opacity: 0;
  pointer-events: none;

  transition: 0.2s ease;

  box-shadow:
    0 8px 20px rgba(40,30,60,0.18);
}


.sidebar button:hover::after {
  opacity: 1;

  transform:
    translateY(-50%)
    translateX(0);
}


/* Logout separation */

.sidebar button:last-child {
  margin-top: 5px;

  border-top: 1px solid rgba(150,130,170,0.15);
}


/* =====================================================
   MAIN CHAT CONTAINER
===================================================== */

.container {
  position: relative;

  width: 430px;
  height: 680px;

  background: rgba(255,255,255,0.72);

  backdrop-filter: blur(25px);

  border:
    1px solid rgba(255,255,255,0.9);

  border-radius: 30px;

  overflow: hidden;

  display: flex;
  flex-direction: column;

  box-shadow:
    0 25px 70px rgba(75,60,110,0.16);

  animation: chatAppear 0.5s ease;

  z-index: 5;
}


@keyframes chatAppear {

  from {
    opacity: 0;
    transform: translateY(20px) scale(0.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}


/* =====================================================
   CHAT HEADER
===================================================== */

.header {

  height: 72px;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  background:
    linear-gradient(
      135deg,
      #aee4f8,
      #d9c8ee,
      #f1b9d0
    );

  color: #302943;

  font-size: 19px;

  font-weight: 800;

  letter-spacing: 0.2px;

  border-bottom:
    1px solid rgba(255,255,255,0.75);

  box-shadow:
    0 5px 20px rgba(120,90,150,0.08);
}


/* little decorative glow */

.header::before {

  content: "";

  position: absolute;

  width: 90px;
  height: 90px;

  border-radius: 50%;

  background: rgba(255,255,255,0.22);

  left: -35px;
  top: -45px;

}


/* =====================================================
   MOOD
===================================================== */

#mood {

  padding: 12px 18px;

  text-align: center;

  color: #756a82;

  font-size: 13px;

  background: rgba(255,255,255,0.45);

  border-bottom:
    1px solid rgba(230,220,235,0.55);
}


/* =====================================================
   CHAT BOX
===================================================== */

#chatbox {

  flex: 1;

  overflow-y: auto;

  padding: 20px 18px;

  display: flex;

  flex-direction: column;

  gap: 5px;

  scroll-behavior: smooth;
}


/* scrollbar */

#chatbox::-webkit-scrollbar {
  width: 5px;
}

#chatbox::-webkit-scrollbar-thumb {
  background: #d7c8df;
  border-radius: 10px;
}


/* =====================================================
   CHAT MESSAGES
===================================================== */

.msg {

  margin: 5px 0;

  padding: 11px 14px;

  border-radius: 17px;

  max-width: 78%;

  font-size: 13px;

  line-height: 1.5;

  animation: messageAppear 0.25s ease;

  box-shadow:
    0 4px 12px rgba(80,60,100,0.05);
}


@keyframes messageAppear {

  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


.user {

  background:
    linear-gradient(
      135deg,
      #d8c8ef,
      #e7d8f1
    );

  align-self: flex-end;

  color: #4d4160;

  border-bottom-right-radius: 5px;
}


.bot {
  background:
    linear-gradient(
      135deg,
      #e2f5fc,
      #edf4ff
    );

  align-self: flex-start;

  color: #4d5964;

  border-bottom-left-radius: 5px;

  max-width: 90%;
}


/* AI TYPING INDICATOR */

.typing-message {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 55px;
  padding: 13px 14px;
}

.typing-message::before {
  display: none;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #8aa6b5;
  animation: typingBounce 1.2s infinite ease-in-out;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.15s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes typingBounce {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: 0.45;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}


/* =====================================================
   CHAT INPUT AREA
===================================================== */

.container > div:last-child {

  display: flex;

  padding: 12px;

  gap: 8px;

  background:
    rgba(255,255,255,0.7);

  border-top:
    1px solid rgba(230,220,235,0.7);
}


/* Input */

input#userInput {

  flex: 1;

  padding: 13px 16px;

  border: 1px solid #e5dced;

  border-radius: 15px;

  outline: none;

  background: rgba(249,246,252,0.9);

  color: #51465f;

  font-family: inherit;

  font-size: 13px;

  transition: 0.25s ease;
}


input#userInput::placeholder {

  color: #8f5baa;

  font-weight: 500;
}


input#userInput:focus {

  background: white;

  border-color: #c6b3df;

  box-shadow:
    0 0 0 4px rgba(198,179,223,0.14);
}


/* Send button */

button.send {

  border: none;

  padding: 0 18px;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #a9e2f7,
      #d3b9e9
    );

  color: #383047;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.25s ease;
}


button.send:hover {

  transform: translateY(-2px);

  box-shadow:
    0 8px 18px rgba(110,85,150,0.18);
}


/* =====================================================
   GENERAL POPUPS
===================================================== */

.popup {

  position: fixed;

  top: 50%;

  left: 50%;

  transform: translate(-50%, -50%);

  width: 340px;

  max-height: 80vh;

  overflow-y: auto;

  background:
    rgba(255,255,255,0.88);

  backdrop-filter: blur(25px);

  border:
    1px solid rgba(255,255,255,0.9);

  border-radius: 24px;

  padding: 22px;

  display: none;

  box-shadow:
    0 25px 70px rgba(60,45,85,0.2);

  z-index: 50;

  animation: popupAppear 0.25s ease;
}


@keyframes popupAppear {

  from {
    opacity: 0;
    transform:
      translate(-50%, -48%)
      scale(0.96);
  }

  to {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
  }

}


.popup h2,
.popup h3 {

  color: #403653;

  margin-bottom: 12px;
}


/* =====================================================
   DASHBOARD
===================================================== */

#dashboard {
  position: fixed;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 680px;
  max-width: 88vw;

  max-height: 82vh;

  overflow-y: auto;

  padding: 25px 28px;

  background: rgba(255,255,255,0.96);

  backdrop-filter: blur(25px);

  border-radius: 30px;

  border: 1px solid rgba(255,255,255,0.9);

  box-shadow:
    0 25px 80px rgba(70,50,100,0.25);

  display: none;

  z-index: 100;
}

#dashboard h2 {
  text-align: center;

  color: #403653;

  font-size: 27px;

  margin-bottom: 25px;
}

#dashboard canvas {
  height: 220px !important;
  margin: 0 0 22px 0 !important;
}

@media (max-width: 800px) {

  #dashboard {
    width: 92vw;
    max-width: 92vw;
    padding: 20px;
  }

  #dashboard canvas {
    height: 210px !important;
  }

}


/* =====================================================
   JOURNAL
===================================================== */

.journal-box {

  width: 390px;

  max-height: 80vh;

  padding: 25px;

  background:
    rgba(255,255,255,0.9);

  backdrop-filter: blur(25px);

  box-shadow:
    0 25px 70px rgba(70,50,90,0.2);

  border-radius: 25px;
}


.journal-box h2 {

  text-align: center;

  color: #403653;

  margin-bottom: 18px;
}


#journalText {

  width: 100%;

  height: 130px;

  border-radius: 16px;

  border:
    1px solid #e6dcec;

  padding: 14px;

  background: #faf7fd;

  outline: none;

  font-family: inherit;

  font-size: 13px;

  resize: none;

  margin-bottom: 12px;
}


#journalText:focus {

  background: white;

  border-color: #c6b3df;

  box-shadow:
    0 0 0 4px rgba(198,179,223,0.13);
}


.save-btn {

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #aee4f8,
      #d9c4eb
    );

  color: #403653;

  font-weight: 700;

  cursor: pointer;

  transition: 0.25s;
}


.save-btn:hover {

  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(120,90,150,0.15);
}


#journalList {

  max-height: 280px;

  overflow-y: auto;

  margin-top: 12px;
}


.journal-entry {

  background:
    linear-gradient(
      135deg,
      #f5eafa,
      #fcebf1
    );

  padding: 13px;

  border-radius: 15px;

  margin-bottom: 9px;

  color: #51475d;

  font-size: 13px;

  line-height: 1.5;

  animation: messageAppear 0.3s ease;
}


.journal-date {

  font-size: 10px;

  color: #8e8298;

  margin-bottom: 6px;
}


/* =====================================================
   JOURNAL LOCK
===================================================== */

.lock-box {

  width: 330px;

  padding: 28px;

  text-align: center;

  background:
    rgba(255,255,255,0.92);

  backdrop-filter: blur(20px);

  border-radius: 25px;

  box-shadow:
    0 25px 70px rgba(60,45,85,0.2);
}


.lock-box h2 {

  color: #403653;

  margin-bottom: 8px;
}


.lock-box p {

  color: #81768d;

  font-size: 13px;

  margin-bottom: 12px;
}


.lock-box input {

  width: 100%;

  padding: 13px;

  border-radius: 14px;

  border: 1px solid #e5dced;

  background: #faf7fd;

  outline: none;

  margin: 10px 0;

  text-align: center;
}


.lock-box button {

  width: 100%;

  padding: 13px;

  border: none;

  border-radius: 14px;

  background:
    linear-gradient(
      135deg,
      #aee4f8,
      #d9c4eb
    );

  color: #403653;

  font-weight: 700;

  cursor: pointer;
}


/* =====================================================
   DAILY CHECK-IN
===================================================== */

.checkin-box {

  width: 400px;

  padding: 26px;

  border-radius: 26px;

  background:
    rgba(255,255,255,0.94);

  backdrop-filter: blur(25px);

  box-shadow:
    0 25px 70px rgba(70,50,90,0.2);
}


.checkin-header {

  display: flex;

  align-items: center;

  gap: 14px;

  margin-bottom: 8px;
}


.checkin-icon {

  width: 52px;
  height: 52px;

  border-radius: 17px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 26px;

  background:
    linear-gradient(
      135deg,
      #d4f3e9,
      #dcecff
    );
}


.checkin-header h2 {

  margin: 0;

  color: #403653;

  font-size: 21px;
}


.checkin-header p {

  margin-top: 4px;

  color: #8a8092;

  font-size: 12px;
}


.checkin-date {

  margin: 15px 0;

  color: #978d9e;

  font-size: 12px;
}


.checkin-box h3 {

  color: #554a63;

  font-size: 14px;

  margin-bottom: 13px;
}


.mood-options {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 20px;
}


.mood-option {

  border:
    1px solid #eee5f2;

  background:
    #faf8fc;

  border-radius: 16px;

  padding: 12px 5px;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 5px;

  transition: 0.2s ease;
}


.mood-option span {

  font-size: 24px;
}


.mood-option small {

  color: #71667d;

  font-size: 11px;
}


.mood-option:hover {

  transform: translateY(-3px);

  box-shadow:
    0 8px 20px rgba(120,100,150,0.12);
}


.mood-option.selected {

  background:
    linear-gradient(
      135deg,
      #e3f2fd,
      #f3e5f5
    );

  border-color: #cbb7dc;

  transform: translateY(-2px);

  box-shadow:
    0 8px 22px rgba(130,100,160,0.15);
}


.checkin-label {

  display: block;

  color: #554a63;

  font-size: 13px;

  margin-bottom: 8px;
}


.checkin-note {

  width: 100%;

  min-height: 105px;

  resize: vertical;

  border:
    1px solid #eee6f3;

  border-radius: 16px;

  padding: 13px;

  outline: none;

  background: #fcfaff;

  color: #51475c;

  font-family: inherit;

  font-size: 13px;
}


.checkin-note:focus {

  border-color: #cbb7dc;

  box-shadow:
    0 0 0 3px rgba(203,183,220,0.2);
}


.checkin-note::placeholder {

  color: #aaa1b2;
}


.save-checkin {

  width: 100%;

  margin-top: 14px;

  padding: 13px;

  border: none;

  border-radius: 15px;

  cursor: pointer;

  background:
    linear-gradient(
      135deg,
      #b3e5fc,
      #e1bee7
    );

  color: #4d4258;

  font-weight: 700;

  transition: 0.2s;
}


.save-checkin:hover {

  transform: translateY(-2px);

  box-shadow:
    0 8px 20px rgba(150,120,170,0.18);
}


#checkinMessage {

  text-align: center;

  margin-top: 10px;

  font-size: 12px;

  color: #6d6280;
}


/* =====================================================
   AFFIRMATION
===================================================== */

.affirmation-box {

  position: fixed;

  bottom: 25px;

  right: 25px;

  max-width: 280px;

  padding: 14px 18px;

  border-radius: 17px;

  background:
    rgba(255,255,255,0.85);

  backdrop-filter: blur(18px);

  color: #51475d;

  font-size: 13px;

  line-height: 1.5;

  box-shadow:
    0 10px 30px rgba(70,50,90,0.15);

  opacity: 0;

  transition: 0.4s;

  z-index: 100;
}

  );

.return-dashboard:hover {

.ai-table {

  </style>
</head>

<body>
<button class="return-dashboard" onclick="goToDashboard()">
  ← Dashboard
</button>
<script>
if(!localStorage.getItem("username")){
  window.location.href="login.html";
}
</script>

<!-- Sidebar -->
<div class="sidebar">
  <button data-label="Mood Trends" onclick="toggleDashboard()">📊</button>
  <button data-label="History" onclick="togglePopup('historyPopup')">📜</button>
  <button data-label="Analysis" onclick="togglePopup('analysisPopup')">🧠</button>
  <button data-label="Profile" onclick="toggleProfile()">👤</button>
  <button data-label="Journal" onclick="openJournalLock()">📝</button>
  <button data-label="Daily Check-In" onclick="togglePopup('checkinPopup')">🌱</button>

<script>

let moodHistory=[];
let moodScores=[];
let chart1, chart2;
let currentPopup=null;
let profileOpen=false;

// Enter key
document.getElementById("userInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") sendMessage();
});

// SEND MESSAGE
async function sendMessage() {
  let input = document.getElementById("userInput").value.trim();

  if (!input) return;

  let chatbox = document.getElementById("chatbox");
  const username = localStorage.getItem("username") || "Friend";

  // Show user message
  chatbox.innerHTML += `
    <div class="msg user">${input}</div>
  `;

  document.getElementById("userInput").value = "";

  // Show typing
  chatbox.innerHTML += `
    <div class="msg bot typing-message" id="typing">
    <span class="typing-dot"></span>
    <span class="typing-dot"></span>
    <span class="typing-dot"></span>
  </div>
  `;

  chatbox.scrollTop = chatbox.scrollHeight;

  try {

    const res = await fetch("http://localhost:5000/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: input,
        name: username
      })
    });

    // Check HTTP status
    if (!res.ok) {
      throw new Error(`Server error: ${res.status}`);
    }

    const data = await res.json();

    // Remove typing
    document.getElementById("typing")?.remove();

    // Show bot reply
chatbox.innerHTML += `
  <div class="msg bot">${formatAIResponse(data.reply)}</div>
`;

    chatbox.scrollTop = chatbox.scrollHeight;

    // Update mood
    if (data.mood) {
      updateMood(data.mood);
    }

    // Show affirmation
    if (data.affirmation) {
      showAffirmation(data.affirmation);
    }

    // Save mood history
    if (data.moodHistory) {
      localStorage.setItem(
        "moodHistory",
        JSON.stringify(data.moodHistory)
      );
    }

  } catch (error) {

    console.error("CHAT ERROR:", error);

    // Remove typing
    document.getElementById("typing")?.remove();

    // Show error in chat
    chatbox.innerHTML += `
      <div class="msg bot">
        Sorry, I'm having trouble connecting right now 💙
        <br>
        <small>Please make sure the MindMelo server is running.</small>
      </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;
  }
}

// MOOD
function updateMood(mood) {

  let emoji = "🙂";
  let score = 3;
  let moodName = "neutral";


  if (mood === "happy") {

    emoji = "😊";
    score = 5;
    moodName = "happy";

  }
  else if (mood === "sad") {

    emoji = "💙";
    score = 2;
    moodName = "sad";

  }
  else if (mood === "stressed") {

    emoji = "😓";
    score = 1;
    moodName = "stressed";

  }


  document.getElementById("mood").innerText =
    "Mood: " + emoji;


  // Keep current-session arrays
  moodHistory.push(moodName);
  moodScores.push(score);


  // Display history
  document.getElementById("history").innerText =
    moodHistory.join(" → ");


  // Save locally
  localStorage.setItem(
    "moodHistory",
    JSON.stringify(moodHistory)
  );


  analyze();
}

// ANALYSIS
function analyze(){
  let avg=moodScores.reduce((a,b)=>a+b,0)/moodScores.length;

  let msg="";
  if(avg>=4) msg="😊 Positive mood overall!";
  else if(avg>=2) msg="🙂 Mixed emotions.";
  else msg="💙 You may be stressed.";

  document.getElementById("analysis").innerText=msg;
}

// DASHBOARD
async function toggleDashboard() {

  const dashboard =
    document.getElementById("dashboard");

  // Close dashboard
  if (dashboard.style.display === "block") {

    dashboard.style.display = "none";

    return;
  }


  // Open dashboard
  dashboard.style.display = "block";


  // Wait until browser renders the dashboard
  await new Promise(resolve =>
    requestAnimationFrame(resolve)
  );


  // Load charts
  await renderCharts();

}

async function renderCharts() {

  const username =
    localStorage.getItem("username") || "Friend";

  try {

    const response = await fetch(
      `http://localhost:5000/insights/${encodeURIComponent(username)}`
    );

    const data = await response.json();

    if (!data.success) {
      console.error("Could not load insights");
      return;
    }


    /* =====================================================
       DESTROY OLD CHARTS
    ===================================================== */

    if (chart1) {
      chart1.destroy();
    }

    if (chart2) {
      chart2.destroy();
    }


    /* =====================================================
       MOOD COUNTS
    ===================================================== */

    const counts = data.checkinCounts;


    /* =====================================================
       📊 BAR CHART
    ===================================================== */

    const barCanvas =
      document.getElementById("barChart");

    chart1 = new Chart(barCanvas, {

      type: "bar",

      data: {

        labels: [
          "Happy",
          "Okay",
          "Sad",
          "Stressed",
          "Numb",
          "Tired"
        ],

        datasets: [{

          label: "Check-ins",

          data: [
            counts.happy || 0,
            counts.okay || 0,
            counts.sad || 0,
            counts.stressed || 0,
            counts.numb || 0,
            counts.tired || 0
          ],

          borderWidth: 1,

          borderRadius: 10,

          barPercentage: 0.65,

          categoryPercentage: 0.7

        }]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        plugins: {

          legend: {
            display: false
          },

          tooltip: {

            callbacks: {

              label: function(context) {

                return " Check-ins: " +
                  context.parsed.y;

              }

            }

          }

        },


        scales: {

          x: {

            grid: {
              display: false
            },

            ticks: {

              color: "#756a82",

              font: {
                size: 11
              }

            }

          },


          y: {

            beginAtZero: true,

            suggestedMax: Math.max(
              3,
              Math.max(
                counts.happy || 0,
                counts.okay || 0,
                counts.sad || 0,
                counts.stressed || 0,
                counts.numb || 0,
                counts.tired || 0
              ) + 1
            ),

            ticks: {

              stepSize: 1,

              color: "#756a82",

              precision: 0

            },

            grid: {

              color: "rgba(120,100,140,0.10)"

            }

          }

        }

      }

    });


    /* =====================================================
       📈 MOOD TREND
    ===================================================== */

    const moods =
      data.checkinMoods || [];


    const moodValues = moods.map(mood => {

      if (mood === "happy") return 5;

      if (mood === "okay") return 4;

      if (mood === "neutral") return 3;

      if (mood === "sad") return 2;

      if (mood === "numb") return 2;

      if (mood === "tired") return 2;

      if (mood === "stressed") return 1;

      return 3;

    });


    const moodLabels = moods.map(
      (_, index) => `Check-in ${index + 1}`
    );


    /* =====================================================
       📈 LINE CHART
    ===================================================== */

    const lineCanvas =
      document.getElementById("lineChart");


    chart2 = new Chart(lineCanvas, {

      type: "line",

      data: {

        labels: moodLabels,

        datasets: [{

          label: "Mood Trend",

          data: moodValues,

          tension: 0.35,

          borderWidth: 3,

          pointRadius: 6,

          pointHoverRadius: 8,

          fill: false

        }]

      },


      options: {

        responsive: true,

        maintainAspectRatio: false,


        plugins: {

          legend: {

            display: true,

            position: "top",

            labels: {

              color: "#665a72",

              font: {
                size: 11
              }

            }

          },


          tooltip: {

            callbacks: {

              label: function(context) {

                const value =
                  context.parsed.y;

                const moodNames = {

                  5: "Happy 😊",

                  4: "Okay 🙂",

                  3: "Neutral 😐",

                  2: "Low 😔",

                  1: "Stressed 😓"

                };

                return moodNames[value] ||
                  "Mood";

              }

            }

          }

        },


        scales: {

          x: {

            grid: {

              color:
                "rgba(120,100,140,0.08)"

            },

            ticks: {

              color: "#756a82",

              font: {
                size: 10
              }

            }

          },


          y: {

            min: 1,

            max: 5,

            ticks: {

              stepSize: 1,

              color: "#756a82",

              callback: function(value) {

                const labels = {

                  1: "Stressed",

                  2: "Low",

                  3: "Neutral",

                  4: "Okay",

                  5: "Happy"

                };

                return labels[value] || "";

              }

            },

            grid: {

              color:
                "rgba(120,100,140,0.10)"

            }

          }

        }

      }

    });


  } catch (error) {

    console.error(
      "❌ Dashboard chart error:",
      error
    );

  }

}

function handlePin() {

  const inputPin =
    document.getElementById("journalPin").value.trim();

  const username =
    localStorage.getItem("username") || "Friend";

  // USER-SPECIFIC PIN KEY
  const pinKey =
    "journalPin_" + username;

  const savedPin =
    localStorage.getItem(pinKey);

  if (!inputPin) {
    alert("Please enter a PIN 🔐");
    return;
  }

  // FIRST TIME FOR THIS USER
  if (!savedPin) {

    localStorage.setItem(
      pinKey,
      inputPin
    );

    alert("PIN set successfully 🔒");

    openJournal();

    return;
  }

  // EXISTING USER → CHECK PIN
  if (inputPin === savedPin) {

    openJournal();

  } else {

    alert("Wrong PIN ❌");

  }
}

async function saveJournal() {

  await fetch("http://localhost:5000/journal", {
    method: "POST",

    body: JSON.stringify({
      name: username,
      text: text
    })
  });

  document.getElementById("journalText").value = "";

  loadJournal();
  showAffirmation();
}

async function loadJournal() {
  let username = localStorage.getItem("username") || "Friend";

  let res = await fetch(`http://localhost:5000/journal/${username}`);
  let data = await res.json();

  let html = "";

  data.reverse().forEach(entry => {
    let date = new Date(entry.date).toLocaleString();

    html += `
      <div class="journal-entry">
        <div class="journal-date">${date}</div>
        <div>${entry.text}</div>
      </div>
    `;
  });

  document.getElementById("journalList").innerHTML = html;
}

function showAffirmation(text){
  let box = document.getElementById("affirmationBox");

  box.innerText = text || "You're doing okay 💙";

  box.style.opacity = 1;

  setTimeout(()=>{
    box.style.opacity = 0;

  }


  try {

    const response = await fetch(
      "http://localhost:5000/checkin",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          name: username,
          mood: selectedCheckinMood,
          note: note
        })
      }
    );


    const data = await response.json();


    if (!response.ok || !data.success) {

      throw new Error(
        data.message || "Could not save check-in"

    // Success
   message.innerHTML = `
  Check-in saved successfully ✨

  <button
    onclick="window.location.href='insights.html'"
    style="
      margin-top:10px;
      padding:8px 14px;
      border:none;
      border-radius:12px;
      background:linear-gradient(135deg,#b3e5fc,#e1bee7);
      color:#4d4258;
      font-weight:600;
      cursor:pointer;
    "
  >
    View My Insights →
  </button>
`;


    // Clear note
    document.getElementById("checkinNote").value = "";


    // Remove selected mood
    document.querySelectorAll(".mood-option").forEach(btn => {
      btn.classList.remove("selected");

    selectedCheckinMood = null;

    );

function formatAIResponse(text) {

  if (!text) return "";

  // Escape HTML first for safety
  text = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");

  // Convert bold
  text = text.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  // Convert bullet points
  text = text.replace(
    /^\s*[-*]\s+(.*)$/gm,
    "<li>$1</li>"
  );

  // Wrap consecutive list items
  text = text.replace(
    /(<li>.*?<\/li>)(\s*<li>.*?<\/li>)*/gs,
    "<ul>$&</ul>"
  );

  // Convert numbered lists
  text = text.replace(
    /^\s*\d+\.\s+(.*)$/gm,
    "<li>$1</li>"
  );

  // Convert Markdown tables
  const lines = text.split("\n");

  let output = [];
  let inTable = false;

  for (let i = 0; i < lines.length; i++) {

    const line = lines[i].trim();

    // Detect table row
    if (
      line.startsWith("|") &&
      line.endsWith("|")
    ) {

      // Ignore separator row
      if (/^\|[\s\-:|]+\|$/.test(line)) {
        continue;
      }

      const cells = line
        .split("|")
        .slice(1, -1)
        .map(cell => cell.trim());

      if (!inTable) {

        output.push(
          '<table class="ai-table"><tbody>'
        );

        output.push(
          "<tr>" +
          cells.map(cell => `<th>${cell}</th>`).join("") +
          "</tr>"
        );

        inTable = true;

      } else {

        output.push(
          "<tr>" +
          cells.map(cell => `<td>${cell}</td>`).join("") +
          "</tr>"
        );
      }

    } else {

      if (inTable) {
        output.push("</tbody></table>");
        inTable = false;
      }

      output.push(line);
    }
  }

  if (inTable) {
    output.push("</tbody></table>");
  }

  // Convert remaining line breaks
  return output.join(" ");
}
